# Plan 275 F.4 — the gate this package did not have.
#
# WHY THIS EXISTS. Measured 2026-08-21: nova-http, nova-tls, nova-polaris,
# nova-compress, nova-bignum and nova-socks had one guard file each and ZERO
# workflows between them. Nothing judged these repositories at all. Rule G8 of
# the nova tree's gate conventions is the same here: a mechanism only the person
# who remembers it can start is not a mechanism.
#
# WHAT IT COST, twice in one day (2026-08-23):
#   * nova-polaris carried tag v0.1.4 over a commit whose nova.toml still said
#     version 0.1.3;
#   * its nova.lock.toml was untracked AND pinned a `compress` that no longer
#     compiles under the current compiler -- every local run resolved through
#     nova.override.toml to sibling checkouts at HEAD, so the PUBLISHED
#     combination had been rotting unseen. The nova repository's flagship build
#     broke on exactly that.
#
# WHY IT BUILDS THE COMPILER. A package repository holds no compiler, and
# `nova test` needs one plus the runtime C tree. There is no published binary to
# download yet, so the honest option is to build it from nova's main branch. The
# cache makes that cheap after the first run. When a release binary exists, this
# job replaces the build with a download and keeps everything else.
#
# THE OVERRIDE IS THE POINT. nova.override.toml is gitignored and never reaches
# CI, so resolution here goes through the lock and the manifests -- which is
# precisely the combination no local run ever exercises.
name: pkg-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    name: guards + nova test src
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout this package
        uses: actions/checkout@v4
        with:
          path: pkg

      # Full history: the compiler build reads its own git metadata, and the
      # runtime submodule is mandatory (plan 22 F2 aborts without libuv).
      - name: Checkout nova (compiler + runtime + std)
        uses: actions/checkout@v4
        with:
          repository: nv-lang/nova
          submodules: recursive
          fetch-depth: 0
          path: nova

      - name: Setup Rust toolchain (pinned to nova's MSRV)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"

      - name: Install system deps (docs/guide/linux-build.md recipe)
        run: sudo apt-get update && sudo apt-get install -y clang cmake make libgc-dev libuv1-dev build-essential

      - name: Cache cargo registry + nova-cli target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nova/nova-cli/target
          key: ${{ runner.os }}-pkggate-${{ hashFiles('nova/nova-cli/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-pkggate-

      - name: Build nova
        working-directory: nova/nova-cli
        run: cargo build --release

      # Every guard this repository ships, not a list to keep in step with:
      # a guard added tomorrow is run tomorrow, without editing this file.
      # A repository with no guards is not silently green -- it says so.
      - name: Guards of this repository
        working-directory: pkg
        run: |
          set -uo pipefail
          n=0; rc=0
          for g in scripts/guards/check-*.sh; do
            [ -e "$g" ] || continue
            n=$((n+1))
            echo "::group::$g"
            bash "$g" . || { echo "::error::guard failed: $g"; rc=1; }
            echo "::endgroup::"
          done
          echo "guards run: $n"
          if [ "$n" -eq 0 ]; then
            echo "::warning::this repository ships no guards"
          fi
          exit $rc

      # The manifest version and the newest tag pointing at this commit must
      # agree. Caught nothing here only because it was fixed hours before this
      # file existed -- v0.1.4 of polaris stood over a manifest saying 0.1.3.
      - name: Tag and manifest agree
        working-directory: pkg
        run: |
          set -uo pipefail
          ver=$(grep -m1 '^version[[:space:]]*=' nova.toml | sed 's/.*"\(.*\)".*/\1/')
          tag=$(git tag --points-at HEAD | grep -E '^v[0-9]' | head -1 || true)
          if [ -z "$tag" ]; then
            echo "no release tag on this commit — nothing to compare (manifest says $ver)"
            exit 0
          fi
          if [ "$tag" != "v$ver" ]; then
            echo "::error::tag $tag stands over a manifest declaring $ver"
            exit 1
          fi
          echo "tag $tag matches manifest $ver"

      # Resolution goes through the lock and the manifests, with no override in
      # sight — the combination a user actually gets.
      - name: nova test src
        working-directory: pkg
        env:
          NOVA_RT_DIR: ${{ github.workspace }}/nova/compiler-codegen/nova_rt
          NOVA_CG_INCLUDE: ${{ github.workspace }}/nova/compiler-codegen
          NOVA_STD_PATH: ${{ github.workspace }}/nova/std/src
        run: |
          test ! -f nova.override.toml || { echo "::error::nova.override.toml reached CI — it must stay gitignored"; exit 1; }
          "${GITHUB_WORKSPACE}/nova/nova-cli/target/release/nova" test src
